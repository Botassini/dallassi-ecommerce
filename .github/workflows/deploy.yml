name: Deploy Automático para HostGator

on:
  push:
    branches:
      - main # Altere para 'master' se essa for sua branch principal

permissions:
  contents: read

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Obter código do repositório
        uses: actions/checkout@v4

      - name: Sincronizar arquivos via SFTP
        uses: SamKirsch/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/ # Ajuste se for publicar em uma subpasta
